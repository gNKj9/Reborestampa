# Reborestampa — stack local completa.
# Uso:  cp .env.example .env  &&  docker compose up --build
#
# Notas de segurança:
# - A base de dados só publica porto em 127.0.0.1 (nunca em 0.0.0.0).
# - Segredos vêm do .env, nunca estão escritos aqui.
# - A rede `internal` não tem saída para a Internet; só o frontend está na `edge`.

name: reborestampa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Apenas loopback: permite usar psql/Prisma Studio sem expor a DB à rede.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  # Migrações + seed correm num contentor efémero com as devDependencies
  # (a imagem de runtime não leva a CLI do Prisma).
  migrate:
    build:
      context: ./backend
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: development
    command: sh -c "npm run db:deploy && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # A imagem é de produção (devDependencies podadas): não herdar o
      # NODE_ENV=development do .env, que ativa o logger pretty.
      NODE_ENV: production
      PORT: 4000
      # O host da DB é o nome do serviço dentro da rede do compose.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    networks:
      - internal
      - edge

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js inlina isto no bundle: tem de ser o URL que o BROWSER usa.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - edge

volumes:
  db_data:

networks:
  internal:
    internal: true
  edge:
