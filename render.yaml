# Blueprint da Render (https://render.com/docs/blueprint-spec).
# Cria um único Web Service Docker que serve o site e a API na mesma origem.
#
# Depois de criar o Blueprint, preencher no dashboard os dois segredos:
#   DATABASE_URL        -> connection string do Neon, com sslmode=verify-full
#   SEED_ADMIN_PASSWORD -> palavra-passe do administrador

services:
  - type: web
    name: reborestampa
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: STATIC_DIR
        value: /app/web
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # O site e a API partilham a origem; esta lista serve para clientes
      # externos legítimos e para o log refletir a origem real.
      - key: CORS_ORIGIN
        value: https://reborestampa.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@reborestampa.pt
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Notificação de novos pedidos (opcional). Sem chave, o site funciona
      # igual e os pedidos ficam na caixa de entrada.
      - key: RESEND_API_KEY
        sync: false
      # Definido no dashboard: muda entre teste (email da conta Resend) e
      # produção (email da empresa). Com sync:false, um Sync do Blueprint não
      # sobrescreve o valor.
      - key: CONTACT_NOTIFY_TO
        sync: false
      - key: CONTACT_NOTIFY_FROM
        value: Reborestampa <onboarding@resend.dev>
      - key: PUBLIC_SITE_URL
        value: https://reborestampa.onrender.com
